name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate documentation layout and links
        run: python scripts/check_docs.py

  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev --python ${{ matrix.python-version }}
      - name: Lint the v2 P0 slice
        run: >-
          uv run --python ${{ matrix.python-version }} ruff check
          src/rolo/rkb
          src/rolo/rkb/read_models.py
          src/rolo/mhs_hardware.py
          src/rolo/mhs_sensor.py
          src/rolo/core/models.py
          src/rolo/stages/probe/target_evidence.py
          src/rolo/release_check.py
          src/rolo/probe_baseline.py
          tests/test_rkb_envelope.py
          tests/test_rkb_contract_baseline.py
          tests/test_rkb_typed_queries.py
          tests/test_rkb_storage.py
          tests/test_rkb_schema_roundtrip.py
          tests/test_mhs_hardware.py
          tests/test_mhs_association.py
          tests/test_mhs_api.py
          tests/test_mhs_http.py
          tests/test_mhs_vis.py
          tests/test_mhs_conformance.py
          tests/test_mhs_fixture.py
          tests/test_mhs_manifest_records.py
          tests/test_mhs_linux_inventory.py
          tests/test_rkb_mhs_read_models.py
          tests/test_probe_baseline.py
          examples/mhs-sensor
          scripts/rkb2_landerpi_smoke.py
          scripts/rkb2_capacity_baseline.py
          scripts/rkb2_canary.py
      - name: Run the v2 Probe chain tests
        run: >-
          uv run --python ${{ matrix.python-version }} pytest -q
          tests/test_target_credentials.py
          tests/test_target_executors.py
          tests/test_probe_evidence_contract.py
          tests/test_agent_native_tools.py
          tests/test_probe_session_factory.py
          tests/test_native_tool_session.py
          tests/test_targetd_protocol.py
          tests/test_targetd_ssh_handoff.py
          tests/test_targetd_stage_session.py
          tests/test_targetd_api_read_model.py
          tests/test_targetd_certify_replay.py
          tests/test_signed_artifacts.py
          tests/test_tool_planning.py
          tests/test_tool_conformance.py
          tests/test_product_cli_v2.py
          tests/test_probe_pipeline.py
          tests/test_application_bundles.py
          tests/test_rkb_envelope.py
          tests/test_rkb_contract_baseline.py
          tests/test_rkb_compatibility.py
          tests/test_rkb_typed_queries.py
          tests/test_rkb_storage.py
          tests/test_rkb_schema_roundtrip.py
          tests/test_mhs_hardware.py
          tests/test_mhs_association.py
          tests/test_mhs_api.py
          tests/test_mhs_http.py
          tests/test_mhs_vis.py
          tests/test_mhs_conformance.py
          tests/test_mhs_fixture.py
          tests/test_mhs_manifest_records.py
          tests/test_mhs_linux_inventory.py
          tests/test_rkb_mhs_read_models.py
          tests/test_probe_baseline.py
          examples/mhs-sensor/test_mhs_sensor.py
          scripts/targetd_landerpi_smoke.py
          scripts/targetd_ssh_handoff_smoke.py
          scripts/targetd_rotate_ssh_smoke.py
          scripts/targetd_pending_recovery_smoke.py
          scripts/targetd_certify_landerpi.py
      - name: Compile the v2 source and test tree
        run: python -m compileall -q src tests examples scripts/rkb2_landerpi_smoke.py scripts/rkb2_capacity_baseline.py scripts/rkb2_canary.py scripts/mhs_readonly_canary.py scripts/probe_baseline.py scripts/targetd_pending_recovery_smoke.py scripts/targetd_certify_landerpi.py

  package:
    runs-on: ubuntu-latest
    needs: [probe, docs, mvp-release-gate]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev --python 3.12
      - name: Run product release smoke checks
        run: uv run --python 3.12 rolo release-check
      - name: Build wheel and sdist
        run: uv build
      - name: Verify build artifacts
        run: test -n "$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print -quit)"
      - name: Re-run release check against built artifacts
        run: uv run --python 3.12 rolo release-check --require-artifacts

  mvp-release-gate:
    runs-on: ubuntu-latest
    needs: [docs]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev --python 3.12
      - name: Lint MVP release gate
        run: uv run ruff check src/rolo/mvp scripts/mvp_release_gate.py tests/test_mvp_journey.py tests/test_mvp_release_gate.py
      - name: Run offline MVP replay and artifact checks
        run: uv run pytest -q tests/test_mvp_journey.py tests/test_mvp_release_gate.py
      - name: Execute release gate entrypoint
        run: uv run python scripts/mvp_release_gate.py --suite examples/chassis-rotation-10.json --output-dir .mvp-release-gate
      - name: Upload replay evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rolo-mvp-offline-replay
          path: .mvp-release-gate/
