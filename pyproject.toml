[project]
name = "rolo"
version = "0.1.0"
description = "Small, evidence-backed robot Probe and read-only Tool Surface"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "openai>=1.99,<3",
  "packaging>=24,<27",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "tomli>=2.0,<3; python_version < '3.11'",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
rolo = "rolo.product_cli:app"
robotctl = "rolo.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rolo"]

[tool.hatch.build.targets.wheel.force-include]
"skills/rolo-tool-planning" = "rolo/bundled_skills/rolo-tool-planning"
"skills/rolo" = "rolo/bundled_skills/rolo"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# v2 deliberately retires the v1 integration suite together with its removed
# modules.  Historical files remain for archaeology but are not collected.
python_files = [
  "test_agent_native_tools.py",
  "test_native_tool_session.py",
  "test_probe_evidence_contract.py",
  "test_probe_session_factory.py",
  "test_product_cli_v2.py",
  "test_probe_pipeline.py",
  "test_application_bundles.py",
  "test_rkb_envelope.py",
  "test_rkb_contract_baseline.py",
  "test_mhs_hardware.py",
  "test_mhs_sensor.py",
  "test_target_credentials.py",
  "test_target_executors.py",
  "test_tool_conformance.py",
  "test_tool_planning.py",
]
markers = [
  "lerobot: opt-in integration test requiring a separately installed LeRobot checkout",
  "ssh: opt-in integration test requiring OpenSSH client and server",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
